/* Quiet default HUD, with urgent needs visible and the rest a click away. */
.as-ui{--as-muted:#b4c1ab;--as-border:rgba(202,218,183,.24)}
.as-ui button:disabled{opacity:.62}
.as-ui .as-details-button{font-size:10px;padding:4px 7px;margin-left:auto;margin-right:7px;background:transparent;color:#c9d3bc}
.as-status-top{gap:4px}
.as-needs-summary{margin-top:10px;color:#b9c8ae;font-size:10px;line-height:1.65}
.as-critical-needs{color:#f0bd8c}
.as-ui[data-details="compact"] .as-meters .as-meter:not(.as-health):not(.as-stamina):not(.as-critical){display:none}
.as-ui[data-details="compact"] .as-stamina{grid-column:1/-1}
.as-ui[data-details="expanded"] .as-needs-summary{border-top:1px solid var(--as-border);padding-top:8px}
.as-ui[data-details="compact"] .as-live-log{max-width:320px}
.as-ui .as-journal-button{border-color:#98baa75c;min-width:132px}
.as-hotbar .as-journal-button b{color:#b4d9bf}
.as-world-event{position:absolute;top:160px;left:277px;max-width:330px;padding:7px 12px;border:1px solid #9ab6a03d;border-radius:4px;background:#14281eed;color:#c9d7bd;font-size:11px;line-height:1.5}
.as-inventory{width:min(100%,960px)}
.as-inventory-grid{display:block;margin-top:14px}
.as-inventory-tabs{margin-top:16px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.as-ui .as-inventory-tabs button{min-height:38px;padding:8px 14px;font-size:12px;color:#bccdb0}
.as-filter-row{grid-template-columns:minmax(0,1fr) 180px}
.as-equipment-summary{font-size:11px;color:#bccbb2}
.as-item-list{min-height:120px;max-height:min(46vh,440px);padding-right:10px}
.as-item{grid-template-columns:40px minmax(0,1fr) 126px;gap:6px 13px;padding:14px 0}
.as-item h3{font-size:13px;line-height:1.5}
.as-item p{font-size:11px;color:#b3c3a8;line-height:1.65}
.as-item-facts{font-size:10px;line-height:1.6;color:#d8c693}
.as-item-icon{width:38px;height:42px}
.as-item-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.as-item-count strong{font-size:11px;line-height:1.4}
.as-item-count small{font-size:10px;color:#afc09f}
.as-ui .as-item-action{min-height:30px;font-size:10px;padding:6px 9px}
.as-inventory-actions{justify-content:flex-start;flex-wrap:wrap}
.as-ui .as-inventory-actions button{flex:0 1 130px;font-size:11px;min-height:34px}
.as-recipe-list[data-ui="recipes"]{max-height:min(43vh,400px);padding-right:10px}
.as-recipe{gap:16px;padding:14px 16px}
.as-recipe>div{min-width:0}
.as-recipe h3{font-size:13px;line-height:1.5}
.as-recipe p{font-size:11px;line-height:1.6;color:#b5c5aa}
.as-cost{font-size:10px;line-height:1.55;color:#e0c88f}
.as-recipe-result,.as-recipe-requirements{font-size:10px;line-height:1.6;color:#b6cba7}
.as-recipe-missing{display:block;margin-top:7px;color:#e8b79e;font-size:10px;line-height:1.6}
.as-recipe-missing.as-ready{color:#bfd89e}
.as-ui .as-recipe button{min-width:74px;min-height:36px;font-size:11px}
.as-recipe-filters{gap:14px}
.as-recipe-filters>label{font-size:11px;color:#bdcdb0}
.as-inventory-tip{font-size:11px;color:#b0c09f;line-height:1.65}
.as-result-count{font-size:10px;color:#aabc9e}
.as-catalogue-note{font-size:11px;line-height:1.65;color:#c3cfb7}
.as-conversation-memory{font-size:11px;line-height:1.7;border-left:2px solid #c9b071;background:#c4b5760a;padding:9px 12px;color:#d7c79b;margin:-8px 0 19px}
.as-conversation-text{overflow-wrap:anywhere}
.as-ui .as-conversation-actions button{min-width:160px;min-height:39px;line-height:1.5}
.as-conversation-note{color:#b0c39f;font-size:11px}

/* The journal explains how practice, supplies, projects, and people connect. */
.as-journal{width:min(100%,960px);padding:26px 30px}
.as-journal-strip{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 15px;border-bottom:1px solid var(--as-border);color:#dcc690;font-size:12px}
.as-journal-strip>span:last-child{color:#a6baa0;font-size:10px;letter-spacing:.07em}
.as-journal-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0 20px}
.as-ui .as-journal-tabs button{background:#16271e;font-size:12px;padding:8px 13px;color:#b9cdb0;min-height:37px}
.as-ui .as-journal-tabs button[aria-pressed="true"]{border-color:#d6ba7a;color:#f2d593;background:#4b492855}
.as-journal-search{margin-bottom:16px}
.as-journal-content{min-height:220px;overflow-wrap:anywhere}
.as-journal-lead{padding:13px 15px;margin-bottom:17px;border-left:2px solid var(--as-gold);border-radius:0 4px 4px 0;background:#e8bb590b}
.as-journal-lead p{font-size:13px;line-height:1.65;color:#e3e9d4;margin-top:5px}
.as-skill-grid,.as-project-grid,.as-guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.as-skill-card,.as-project-card,.as-guide-grid>article{border:1px solid var(--as-border);background:#10211766;border-radius:6px;padding:16px}
.as-skill-card header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.as-skill-card h3{font-size:13px;color:#e4ecd7}
.as-skill-card header>b{font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#dbca90}
.as-progress-track{height:5px;margin:13px 0 10px;border-radius:3px;overflow:hidden;background:#9daf8f24}
.as-progress-track>span{height:100%;display:block;background:#bcc888;border-radius:3px}
.as-skill-card p{font-size:11px;line-height:1.6;color:#c4d6b6}
.as-skill-card small{display:block;margin-top:5px;color:#aabc9c;font-size:10px;line-height:1.6}
.as-survival-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:15px 0}
.as-survival-summary>div{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:6px;background:#c8b97b08;border:1px solid #c8b97b29}
.as-survival-summary span{font-size:10px;color:#bdc7a9;letter-spacing:.06em;text-transform:uppercase}
.as-survival-summary strong{font-size:15px;color:#e5d29b}
.as-survival-summary small{font-size:11px;color:#b5c5a7;line-height:1.6}
.as-journal-abilities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.as-journal-abilities>article{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--as-border);border-radius:5px;background:#15241c70}
.as-journal-abilities>article>div{min-width:0}
.as-journal-abilities h3{font-size:12px}
.as-journal-abilities p{margin-top:4px;font-size:11px;line-height:1.6;color:#afc2a2}
.as-ui .as-journal-abilities button{min-width:61px;min-height:34px;padding:7px 10px;font-size:11px;flex-shrink:0}
.as-journal-explainer{font-size:12px;line-height:1.75;color:#bfcdb4;margin-bottom:18px!important}
.as-project-card{display:flex;flex-direction:column;gap:9px}
.as-project-card .as-kicker{font-size:9px;line-height:1.7;color:#c6c497}
.as-project-card h3{font-size:16px;line-height:1.4;letter-spacing:-.015em}
.as-project-card>p{font-size:12px;line-height:1.7;color:#c8d7bc}
.as-project-card>small{font-size:10px;line-height:1.65;color:#bccaaa}
.as-project-card .as-project-cost{color:#e1c384}
.as-project-card footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:10px;border-top:1px solid var(--as-border)}
.as-project-card footer>span{font-size:10px;line-height:1.7;color:#bdc5aa;min-width:0}
.as-ui .as-project-card footer>button{font-size:11px;min-width:74px;min-height:36px;padding:7px 10px;flex-shrink:0}
.as-project-learned{border-color:#91b68c60;background:#99b6830c}
.as-project-learned .as-kicker{color:#b1d5a6}
.as-people-list{display:flex;flex-direction:column;gap:12px}
.as-people-list>article{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px;border:1px solid var(--as-border);border-radius:6px;background:#11221966}
.as-people-list>article>div{min-width:0}
.as-people-list h3{margin:5px 0;font-size:17px}
.as-people-list p,.as-people-list small{color:#c4d2b9;font-size:11px;line-height:1.7}
.as-people-list small{display:block;margin-top:5px;color:#b3c2a7}
.as-ui .as-people-list button{font-size:11px;min-height:36px;flex-shrink:0}
.as-daybook{border-left:1px solid #c3b97759;margin-left:6px;padding-left:18px}
.as-daybook>article{position:relative;display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid #a8bf8d20}
.as-daybook>article:before{content:"";position:absolute;left:-22px;top:19px;width:7px;height:7px;border-radius:50%;background:#cbb875;border:1px solid #17271d}
.as-daybook>article[data-kind="danger"]:before{background:#e4a088}
.as-daybook time{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.8;color:#c8c39a}
.as-daybook p{font-size:12px;line-height:1.8;color:#d5dfc9}
.as-guide-grid>article h3{font-size:14px;line-height:1.5;color:#e5d095}
.as-guide-grid>article p{font-size:12px;line-height:1.85;color:#c4d1b8;margin-top:9px}
.as-empty-state{grid-column:1/-1;padding:28px 20px;border:1px dashed #a3bb8e40;border-radius:6px;text-align:center;background:#9dab8008}
.as-empty-state h3{font-size:15px;color:#deddb6;margin-bottom:8px}
.as-empty-state p{font-size:12px;line-height:1.7;color:#b9c7ac}
.as-atlas-legend{display:flex;flex-wrap:wrap;gap:7px 18px;color:#c5d2b8;font-size:11px;line-height:1.7;margin:12px 0}
.as-atlas-canvas{display:block;max-width:100%;width:100%;height:auto;max-height:440px;object-fit:contain;background:#0e2017;border:1px solid var(--as-border);border-radius:6px}

/* Settings remain legible and reachable on small menus. */
.as-preferences{margin:20px 0 0;padding:14px 0 0;border:0;border-top:1px solid var(--as-border);min-width:0}
.as-preferences legend{padding:0 10px 0 0;font-size:11px;color:#ced6bb}
.as-preferences .as-setting-row{border:0;padding-top:0;align-items:center;gap:12px 20px;flex-wrap:wrap}
.as-ui .as-fullscreen-button{font-size:10px;min-height:32px;padding:6px 10px;margin-left:auto}
.as-slider-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.as-slider-settings label{display:grid;grid-template-columns:1fr auto;gap:7px 10px;color:#c2ceb5;font-size:11px}
.as-slider-settings output{color:#e2cc90;font:11px ui-monospace,SFMono-Regular,Consolas,monospace}
.as-ui input[type="range"]{grid-column:1/-1;display:block;width:100%;min-width:0;height:24px;margin:0;accent-color:var(--as-gold);cursor:pointer}
.as-debug-setting{padding-top:12px;margin-top:13px;font-size:11px}
.as-modal{overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#69855a #16251b;overflow-x:hidden}
.as-modal :is(p,small,h3,.as-cost){overflow-wrap:anywhere}

    }

    invoke(name, ...args) {

    onChange(event) {

      if (target === this.nodes['recipe-tier']) { this.recipeTier = target.value; this.recipePage = 0; this.refreshInventory(true); }
      if (target === this.nodes['recipe-ready']) { this.readyOnly = target.checked; this.recipePage = 0; this.refreshInventory(true); }
      if ([this.nodes.sort, this.nodes.category, this.nodes['item-family'], this.nodes['item-tier']].includes(target)) this.nodes.items.scrollTop = 0;

    onInput(event) {
      if (event.target === this.nodes['item-search']) { this.itemQuery = event.target.value.trim().toLowerCase(); this.itemPage = 0; this.refreshInventory(true); this.nodes.items.scrollTop = 0; }
      if (event.target === this.nodes['recipe-search']) { this.recipeQuery = event.target.value.trim().toLowerCase(); this.recipePage = 0; this.refreshInventory(true); this.nodes.recipes.scrollTop = 0; }

      if (event.target.dataset.setting === 'zoom') { const value = clamp(event.target.value, 70, 150); this.nodes['zoom-value'].textContent = value + '%'; this.invoke('setZoom', value / 100); }
      for (const channel of ['music', 'effects', 'ambience']) if (event.target.dataset.setting === channel + 'Volume') { const value = clamp(event.target.value, 0, 100); this.nodes[channel + '-volume-value'].textContent = value + '%'; this.invoke('setAudioPreference', channel + 'Volume', value / 100); }
    }

    clearReferenceFilters(kind) {
      if (kind === 'items') {
        this.itemQuery = ''; this.category = this.family = this.tier = 'all'; this.itemPage = 0;
        this.nodes['item-search'].value = ''; this.nodes.category.value = this.nodes['item-family'].value = this.nodes['item-tier'].value = 'all';
      } else {
        this.recipeQuery = ''; this.recipeFamily = this.recipeTier = 'all'; this.readyOnly = false; this.recipePage = 0;
        this.nodes['recipe-search'].value = ''; this.nodes['recipe-family'].value = this.nodes['recipe-tier'].value = 'all'; this.nodes['recipe-ready'].checked = false;
      }
      this.refreshInventory(true); this.nodes[kind].scrollTop = 0; this.nodes[kind === 'items' ? 'item-search' : 'recipe-search'].focus({ preventScroll: true });

    applyPreferences(preferences) {
      const p = preferences || {};

      this.root.querySelector('[data-setting="sound"]').checked = this.sound;
      this.root.querySelector('[data-setting="motion"]').checked = p.motion !== false;

        this.nodes['setting-' + channel + 'Volume'].value = channelVolume; this.nodes[channel + '-volume-value'].textContent = channelVolume + '%';
      }
      const volume = Math.round(clamp(p.volume === undefined ? .7 : p.volume, 0, 1) * 100), zoom = Math.round(clamp(p.zoom === undefined ? 1 : p.zoom, .7, 1.5) * 100);
      this.root.querySelector('[data-setting="volume"]').value = volume; this.nodes['volume-value'].textContent = volume + '%';
      this.root.querySelector('[data-setting="zoom"]').value = zoom; this.nodes['zoom-value'].textContent = zoom + '%';
      this.details = !!p.details; this.root.dataset.details = this.details ? 'expanded' : 'compact';
      const details = this.root.querySelector('[data-command="details"]'); details.setAttribute('aria-pressed', String(this.details)); details.textContent = this.details ? 'Details −' : 'Details +';

    onKeydown(event) {
      // The game owns shortcuts. This listener only keeps keyboard focus within an open dialog.
      if (event.key !== 'Tab' || !this.isBlocking()) return;
      const panel = this.state && this.state.conversation && this.screen === 'playing' ? this.nodes['conversation-overlay'] : this.journal && this.journal.open ? this.journal.overlay : this.inventoryOpen ? this.nodes['inventory-overlay'] : this.root.querySelector(`[data-screen="${this.screen}"]`);
      if (!panel || panel.hidden) return;
      const focusable = Array.from(panel.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), summary, [tabindex]:not([tabindex="-1"])')).filter((el) => !el.disabled && !el.hidden && el.getClientRects().length > 0);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && (document.activeElement === first || !panel.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && (document.activeElement === last || !panel.contains(document.activeElement))) { event.preventDefault(); first.focus(); }
    }

    disarmRestart() {
      clearTimeout(this.restartTimer);
      const button = this.root.querySelector('.as-save-actions [data-command="restart"]');
      if (button && button.dataset.confirm) { delete button.dataset.confirm; button.textContent = 'New run'; button.removeAttribute('title'); }
    }

    showScreen(name) {
      if (!['title', 'playing', 'paused', 'dead', 'won'].includes(name)) return;
      this.disarmRestart();
      this.screen = name;
      this.inventoryOpen = false;
      if (this.journal) this.journal.close();
      this.nodes['inventory-overlay'].hidden = true;
      this.nodes['conversation-overlay'].hidden = true;
      this.root.querySelectorAll('[data-screen]').forEach((panel) => { panel.hidden = panel.dataset.screen !== name; });
      this.nodes.hud.hidden = name === 'title';
      this.root.dataset.screen = name;
      if (name === 'title') this.refreshContinue();
      if (name === 'dead' || name === 'won') this.renderEndStats();
      const panel = this.root.querySelector(`[data-screen="${name}"]`);
      if (panel && !panel.hidden) {
        const focus = Array.from(panel.querySelectorAll('button:not(:disabled)')).find((el) => el.getClientRects().length > 0);
        if (focus) focus.focus({ preventScroll: true });
      } else {
        const active = document.activeElement;
        if (active && this.root.contains(active) && typeof active.blur === 'function') active.blur();

    }

    toggleInventory() {
      if (this.screen !== 'playing' || this.state && this.state.conversation) return;
      if (this.journal) this.journal.close();
      this.inventoryOpen = !this.inventoryOpen;
      this.invoke('menuChanged');
      this.nodes['inventory-overlay'].hidden = !this.inventoryOpen;
      if (this.inventoryOpen) {
        this.lastFocus = document.activeElement;
        this.refreshInventory(true);
        this.nodes['inventory-overlay'].querySelector('.as-close').focus({ preventScroll: true });
      } else if (this.lastFocus && this.lastFocus.isConnected && typeof this.lastFocus.focus === 'function' && this.lastFocus !== document.body) {
        this.lastFocus.focus({ preventScroll: true });
      } else if (document.activeElement && this.root.contains(document.activeElement)) {
        document.activeElement.blur();
      }
    }

    toggleJournal() {
      if (!this.journal || this.screen !== 'playing' || this.state && this.state.conversation) return;
      this.invoke('menuChanged');
      if (this.journal.open) { this.journal.close(); if (document.activeElement && this.root.contains(document.activeElement)) document.activeElement.blur(); }
      else { this.inventoryOpen = false; this.nodes['inventory-overlay'].hidden = true; this.journal.show(this.state); }
    }

    isBlocking() { return this.screen !== 'playing' || this.inventoryOpen || !!(this.journal && this.journal.open) || !!(this.state && this.state.conversation); }

    update(state, frameInfo) {
      if (this.destroyed || !state || !state.player) return;
      this.state = state;
      const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
      if (now - this.lastUpdate < 100) return;
      this.lastUpdate = now;
      const player = state.player;
      for (const field of ['health', 'stamina', 'hunger', 'thirst', 'infection']) {
        const value = clamp(player[field], 0, 100);
        const meter = this.root.querySelector(`[data-meter="${field}"]`);
        const valueNode = this.root.querySelector(`[data-meter-value="${field}"]`);
        meter.setAttribute('aria-valuenow', String(Math.round(value)));
        meter.firstElementChild.style.width = `${value}%`;
        valueNode.textContent = `${Math.round(value)}`;
        meter.parentElement.classList.toggle('as-critical', field === 'health' || field === 'stamina' ? value < 25 : value > 60);
      }
      this.nodes.injury.hidden = !player.bleeding;
      const progress = Sirens.Progression && Sirens.Progression.ensure(state);
      this.nodes['needs-summary'].textContent = 'Hunger ' + Math.round(player.hunger) + ' · Thirst ' + Math.round(player.thirst) + (progress ? ' · Fatigue ' + Math.round(progress.fatigue) + (progress.sleeping ? ' · Sleeping' : '') : '') + (player.infection > 0 ? ' · Infection ' + Math.round(player.infection) : '');
      this.nodes['needs-summary'].classList.toggle('as-critical-needs', player.hunger > 60 || player.thirst > 60 || player.infection > 0);
      const hour = Math.floor(number(state.time)) % 24;
      const minute = Math.floor((number(state.time) % 1) * 60);
      this.nodes.time.textContent = `DAY ${String(Math.max(1, Math.floor(number(state.day)))).padStart(2, '0')} · ${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
      const inventory = player.inventory || {};
      this.root.querySelectorAll('[data-count]').forEach((el) => { el.textContent = String(Math.floor(number(inventory[el.dataset.count]))); });
      for (const [id, field] of [['food', 'hunger'], ['water', 'thirst'], ['bandage', 'bleeding']]) this.root.querySelector(`[data-count="${id}"]`).textContent = String(this.quickCount(field, inventory));
      this.refreshQuickActions();
      const weight = this.inventoryWeight(inventory);
      this.nodes['pack-weight'].textContent = `${weight.toFixed(1)} kg`;
      const weapon = this.itemMetadata(player.weapon || 'bat');
      const firearm = weapon.weapon && weapon.weapon.kind === 'firearm' || player.weapon === 'pistol';
      const ammoId = weapon.weapon && weapon.weapon.ammoId || 'ammo';
      this.nodes.weapon.textContent = String(weapon.name || player.weapon || 'Bat').toUpperCase();
      this.nodes.ammo.textContent = firearm ? `${Math.floor(number(player.ammo))} loaded · ${Math.floor(number(inventory[ammoId]))} spare` : this.root.dataset.input === 'touch' ? 'Swap switches weapon · Pack to equip' : 'F to switch weapon · I to equip';
      this.root.querySelector('[data-count="ammo"]').textContent = String(Math.floor(number(inventory[ammoId])));
      const goal = state.goal || {};
      const required = Math.max(1, number(goal.required) || 5);
      const installed = number(goal.parts);
      const carried = number(inventory.parts);
      const openWorld = !!state.world || state.mode === 'openworld';
      this.nodes['objective-kicker'].textContent = openWorld ? 'MAKE IT THROUGH TOMORROW' : 'GET A SIGNAL OUT';
      this.nodes.parts.textContent = openWorld ? goal.complete ? 'RELAY RESTORED' : `${Math.min(required, installed + carried)} / ${required} RELAY PARTS` : `${Math.min(required, installed + carried)} / ${required} PARTS`;
      this.nodes.objective.textContent = openWorld ? Sirens.Progression ? Sirens.Progression.nextTask(state) : 'Explore connected roads. Gather supplies, craft equipment, and establish a shelter.' : goal.complete ? 'Signal sent. Stay alive while help answers.' : installed + carried >= required ? 'You have the parts. Use E at the relay.' : `Find ${Math.max(0, required - installed - carried)} more radio parts. Repair the relay with E.`;
      if (progress) {
        this.nodes['insight-count'].textContent = progress.insight + ' insight';
        const event = progress.event, active = event && event.kind !== 'none' && event.until > state.elapsed;
        this.nodes['world-event'].hidden = !active || this.isBlocking();
        if (active) {
          const label = ({ rain: 'Rain front', migration: 'Dead on the move', cache: 'Traveler cache' })[event.kind], timer = ' · ' + Math.ceil(event.until - state.elapsed) + 's';
          if (this.nodes['world-event-label'].textContent !== label) this.nodes['world-event-label'].textContent = label;
          if (this.nodes['world-event-timer'].textContent !== timer) this.nodes['world-event-timer'].textContent = timer;
        }
      }
      const battle = state.warfare && state.warfare.battle;
      if (battle && battle.active) {
        this.nodes['world-event'].hidden = this.isBlocking();
        this.nodes['world-event-label'].textContent = (battle.type === 'undead' ? 'HORDE SIEGE' : 'RAIDER BATTLE') + ' · ' + battle.spawned + ' arrived · ' + battle.defeated + ' defeated';
        this.nodes['world-event-timer'].textContent = battle.pending ? ' · next wave ' + Math.max(0, Math.ceil(battle.nextWave - state.elapsed)) + 's' : ' · hold the area';
      }
      if (goal.active && number(goal.countdown) > 0) this.nodes.objective.textContent = `Relay active. Survive ${Math.ceil(number(goal.countdown))} seconds until the answer.`;
      this.nodes['world-info'].hidden = !openWorld;
      if (openWorld) {
        const world = state.world || {};
        const gx = (Number(world.originX) || 0) + player.x / (state.tileSize || 32);
        const gy = (Number(world.originY) || 0) + player.y / (state.tileSize || 32);
        this.nodes.region.textContent = label(world.biome || 'Morrow');
        this.nodes.coordinates.textContent = `${Math.floor(gx)}, ${Math.floor(gy)}`;
        this.nodes.exploration.textContent = `${Math.max(1, Math.floor(number(world.visitedCount)))} sectors explored`;
      }
      this.nodes['floor-info'].hidden = !state.stories;
      if (state.stories) {

        this.nodes['stairs-actions'].hidden = !stairs;

        this.nodes['vehicle-fuel'].textContent = `Fuel: ${Math.max(0, Math.floor(number(vehicle.fuel)))} / ${number(vehicle.tank) || 100}`;
        this.nodes['vehicle-condition'].textContent = `Condition: ${Math.round(clamp(vehicle.condition, 0, 100))}%`;
        const exit = this.root.querySelector('.as-vehicle-actions [data-action="vehicle"]');

        refuel.disabled = !!fuelReason; refuel.title = fuelReason || 'Refuel from your pack (G)';
      }

    else aim = { x: state.player.x + Math.cos(state.player.angle || 0) * 100, y: state.player.y + Math.sin(state.player.angle || 0) * 100 };
    return { moveX: moveX, moveY: moveY, sprint: keys.has('ShiftLeft') || keys.has('ShiftRight') || !!(thumbs && thumbs.sprint), sneak: keys.has('KeyC') || !!(thumbs && thumbs.sneak),
      aimX: aim.x, aimY: aim.y, attack: pointer.down || keys.has('Space') || !!(thumbs && thumbs.attack), shoot: pointer.shoot };
  }

  let lastMetrics = performance.now();
  function frame(now) {
    const duration = Math.max(0, now - lastFrame);
    lastFrame = now;
    if (duration > 0 && duration < 1000) {
      frameDurations.push(duration);
      if (frameDurations.length > 180) frameDurations.shift();
    }
    if (now - lastMetrics > 600 && frameDurations.length) {
      const sorted = frameDurations.slice().sort(function (a, b) { return a - b; });
      const mean = frameDurations.reduce(function (a, b) { return a + b; }, 0) / frameDurations.length;
      frameInfo = { fps: Math.round(1000 / Math.max(1, mean)), frameMs: mean, p95: sorted[Math.floor((sorted.length - 1) * 0.95)],
        showDebug: debugOn, mouseX: pointer.x, mouseY: pointer.y };
      lastMetrics = now;
    }
    const elapsed = Math.min(0.1, duration / 1000);
    if (active && state.ended && screen === 'playing') {
      clearInput(); setScreen(state.player.health > 0 && state.won ? 'won' : 'dead'); save(true);
    }
    autoInput = null;
    if (pilot && S.Autoplay.status(pilot).enabled && active && !(social && social.isBlocking()) && (!ui.isBlocking() || screen === 'playing' && !!state.conversation && !ui.inventoryOpen && !(ui.journal && ui.journal.open)) && !state.ended) {
      const choice = S.Autoplay.step(pilot, state, elapsed); autoInput = choice.input;
      if (choice.command) autoCommand(choice.command);
    }
    if (pilot) {
      // Write only changed text so an idle HUD does not force a layout every frame.
      const pilotStatus = S.Autoplay.status(pilot), label = 'AI play: ' + (pilotStatus.enabled ? 'On' : 'Off'), text = pilotStatus.enabled ? pilotStatus.text : 'You are in control.';
      if (autoButton.textContent !== label) { autoButton.textContent = label; autoButton.setAttribute('aria-pressed', String(pilotStatus.enabled)); }
      if (autoStatus.textContent !== text) autoStatus.textContent = text;
    }
    if (networkReady && active) {
      networkSendTime += elapsed; S.Effects.advance(state, elapsed);
      if (networkSendTime >= .05) {
        network.sendInput(ui.isBlocking() || social && social.isBlocking() || state.ended ? { moveX: 0, moveY: 0, attack: false, shoot: false, aimX: state.player.x, aimY: state.player.y } : autoInput || inputSnapshot());
        networkSendTime %= .05;
      }
      accumulator = 0;
    } else if (active && !ui.isBlocking() && !(social && social.isBlocking()) && !state.ended) {
      accumulator += elapsed;
      while (accumulator >= 1 / 60) {
        const oldHealth = state.player.health;
        S.Engine.update(state, 1 / 60, autoInput || inputSnapshot());
        accumulator -= 1 / 60;
        if (state.player.health < oldHealth - 0.2) S.Effects.emit(state, 'hurt');
        if (state.ended) break;
      }
      autoSaveTime += elapsed;
      if (autoSaveTime >= 5) { save(true); autoSaveTime = 0; }
      if (state.ended) { clearInput(); setScreen(state.player.health > 0 && state.won ? 'won' : 'dead'); save(true); }
    } else accumulator = 0;
    renderBrain(false);
    if (touch) touch.update(gameAcceptsInput(), touchContext);
    S.Effects.audio.update(state, active && screen === 'playing' && !ui.isBlocking() && !(social && social.isBlocking()) && !state.ended && !document.hidden, !document.hidden);
    renderer.draw(state, frameInfo);
    uiTime += elapsed;
    if (uiTime > 0.1 || state.ended) {
      ui.update(state, frameInfo);
      if (touch && touch.enabled) touchContext = { use: !ui.nodes.interact.hidden, drive: !state.player.vehicleId && !!(S.Vehicles && S.Vehicles.nearby(state)), driving: !!state.player.vehicleId };
      networkUI.update(networkReady, networkPlayers, state); social.update(networkReady, networkPlayers, state, network ? network.getStatus() : { connected: false }); uiTime = 0;
    }
    debug.hidden = !debugOn || screen === 'title';
    if (!debug.hidden) debug.textContent = frameInfo.fps + ' FPS  |  ' + frameInfo.frameMs.toFixed(1) + ' ms avg  |  ' + frameInfo.p95.toFixed(1) + ' ms p95\n' +
      state.zombies.length + ' active zombies  |  ' + state.stats.aiUpdates + ' AI decisions  |  seed ' + state.seed +
      (state.world ? '\nSector ' + state.world.centerCX + ', ' + state.world.centerCY + '  |  ' + Object.keys(state.world.records).length + ' journaled sectors' : '');
    requestAnimationFrame(frame);
  }
  renderer.resize();
  requestAnimationFrame(frame);

  // Diagnostics surface for reproducible local playtesting.
  S.App = { getState: function () { return state; }, getMetrics: function () { return Object.assign({}, frameInfo); },
    getSocialStatus: function () { return social.getStatus(); }, getVoiceStats: function () { return social.getVoiceStats(); },
    getScreen: function () { return screen; }, getAutoplayStatus: function () { return pilot ? S.Autoplay.status(pilot) : { enabled: false, text: 'Unavailable' }; }, getNetworkStatus: function () { return network ? network.getStatus() : { connected: false }; }, getPreferences: function () { return Object.assign({}, preferences); }, getView: function () { return { zoom: renderer.zoom, ambientMotion: renderer.ambientMotion }; }, getAudioMetrics: S.Effects.audio.metrics,
    getTouchStatus: function () { return touch ? touch.status() : { enabled: false }; } };
})();
</script>
</body>
</html>
